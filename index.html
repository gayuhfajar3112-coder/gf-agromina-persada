              "@type": "Question",
              "name": "Siapa pendiri PT GF Agromina Persada dan apa latar belakangnya?",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "PT GF Agromina Persada didirikan dan dipimpin oleh Gayuh M. Fajar, pengusaha muda putra daerah Watulimo Trenggalek sekaligus mahasiswa aktif Fakultas Peternakan (FAPET) Universitas Brawijaya (UB) Malang. Beliau mengombinasikan latar belakang keilmuan nutrisi dan agribisnis dengan akses langsung pendaratan ikan Samudra Hindia di PPN Prigi."
              }
            },
            {
              "@type": "Question",
              "name": "Komoditas ikan apa saja yang disediakan PT GF Agromina Persada?",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "Kami menyediakan 10 komoditas unggulan utama: Tongkol Lisong, Tembang, Kekek Jawa, Layang Benggol, Cakalang, Lemuru, Tongkol Komo, Madidihang (Yellowfin Tuna), Layang Anggur, dan Ikan Layur, serta Tenggiri, Kakap Merah, Kerapu, Bawal Hitam, Cumi-Cumi, dan Lobster Karang dalam kondisi segar dingin harian maupun beku cold storage -18°C."
              }
            },
            {
              "@type": "Question",
              "name": "Bagaimana cara menghitung estimasi pasokan sampai ketemu jumlah total keseluruhan?",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "Gunakan fitur Kalkulator Pasokan di website resmi kami. Anda dapat memilih jenis ikan, kondisi (segar/beku), volume (kg atau ton), tipe kemasan cold chain, dan kota tujuan kirim truk pendingin. Sistem akan menghitung hingga Jumlah Total Keseluruhan (Rp) dan menyusun draf penawaran otomatis ke WhatsApp pimpinan."
              }
            },
            {
              "@type": "Question",
              "name": "Apa rencana Divisi Peternakan Sapi Terpadu (FAPET UB Project)?",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "Divisi Peternakan Sapi Terpadu di Watulimo Trenggalek merupakan inisiasi Gayuh M. Fajar yang menyinergikan hasil samping perikanan Prigi (tulang dan kepala ikan) menjadi konsentrat tepung ikan kaya kalsium dan protein, dipadukan dengan pakan silase rumput gajah untuk penggemukan sapi potong Limosin dan Simmental berkualitas prima."
              }
            },
            {
              "@type": "Question",
              "name": "Apakah melayani pengiriman luar kota dengan truk pendingin (reefer)?",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "Ya, kami melayani pengiriman terjadwal dengan armada truk berpendingin (reefer truck) ke berbagai kota di Jawa Timur, Jawa Tengah, DI Yogyakarta, Jawa Barat, Jabodetabek, Bali, dan pengiriman kontainer berpendingin antarpulau."
